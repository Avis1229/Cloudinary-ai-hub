version: '3.8'

services:
  beautyp:
    build: .
    container_name: beautyp_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - mongodb
      - minio

  mongodb:
    image: mongo:latest
    container_name: beautyp_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=securepassword123
    ports:
      - "27018:27017" # Using 27018 to avoid conflicts with other MongoDBs
    volumes:
      - beautyp_mongodb_data:/data/db

  minio:
    image: minio/minio
    container_name: beautyp_minio
    restart: unless-stopped
    ports:
      - "9010:9000" # Using 9010 for BeautyP MinIO API (Tripdekho likely uses 9000/9001)
      - "9011:9001" # Using 9011 for BeautyP MinIO Console
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=securepassword123
    volumes:
      - beautyp_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  beautyp_mongodb_data:
  beautyp_minio_data:
